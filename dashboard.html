    .side-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;

      font-size: 0.82rem;
      color: #64748b;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      cursor: pointer;
      transition: color 0.15s ease, transform 0.12s ease;

    .side-item-active { font-weight: 600; color: #0f172a; position: relative; }

      content: '';
      position: absolute;
      left: -0.75rem;
      top: 0.2rem;
      bottom: 0.2rem;
      width: 3px;
      border-radius: 9999px;
      background-color: #002fa7;

    .side-bottom-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.1rem;
      font-size: 0.82rem;
      color: #64748b;
      background: transparent;
      border: none;
      cursor: pointer;

    .side-bottom-link i { font-size: 0.8rem; }
    .side-bottom-link:hover { color: #0f172a; transform: translateX(2px); }

    .menu-toggle .bar {

      background-color: #64748b;

  <script>
    (function () {
      // ✅ You already use full workers.dev URL (no need to route under taimic.tech)
      const QUOTES_API_BASE = "https://taimic-quotes.amy20060226.workers.dev";

      const US_STOCKS_STORAGE_KEY = "taimic_us_stocks_holdings_v1";
      const $ = (id) => document.getElementById(id);

      function withBust(url) {
        const sep = url.includes('?') ? '&' : '?';
        return `${url}${sep}t=${Date.now()}`;
      }

      function fmtUsd(n) {
        const x = Number(n);
        if (!Number.isFinite(x)) return "—";
        return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(x);
      }

      function fmtNum(n) {
        const x = Number(n);
        if (!Number.isFinite(x)) return "0.00";
        return x.toFixed(2);
      }

      function fmtPct(x) {
        const v = x * 100;
        return `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`;
      }

      function safeUpper(s) {
        return String(s || "").trim().toUpperCase();
      }

      function genId() {
        if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
        return "id_" + Math.random().toString(16).slice(2) + "_" + Date.now();
      }

      function loadHoldings() {
        try { return JSON.parse(localStorage.getItem(US_STOCKS_STORAGE_KEY) || "[]"); }
        catch { return []; }
      }

      function saveHoldings(list) {
        localStorage.setItem(US_STOCKS_STORAGE_KEY, JSON.stringify(list));
      }

      // --------------------------
      // Mobile menu
      // --------------------------
      function setupMobileMenu() {
        const toggle = document.getElementById('sidebar-toggle-mobile');
        const overlay = document.getElementById('mobile-menu');
        const panel = document.getElementById('mobile-menu-panel');
        if (!toggle || !overlay || !panel) return;

        let prevBodyOverflow = '';

        function lockScroll() {
          prevBodyOverflow = document.body.style.overflow;
          document.body.style.overflow = 'hidden';
        }
        function unlockScroll() {
          document.body.style.overflow = prevBodyOverflow || '';
        }
        function openMenu() {
          overlay.classList.remove('hidden');
          lockScroll();
          panel.offsetHeight;
          panel.classList.remove('translate-x-full');
        }
        function closeMenu() {
          panel.classList.add('translate-x-full');
          panel.addEventListener('transitionend', () => {
            if (panel.classList.contains('translate-x-full')) {
              overlay.classList.add('hidden');
              unlockScroll();
            }
          }, { once: true });
        }

        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          if (overlay.classList.contains('hidden')) openMenu();
          else closeMenu();
        });

        overlay.addEventListener('click', (event) => {
          if (event.target === overlay) closeMenu();
        });

        window.__closeMobileMenu = closeMenu;
      }

      window.mobileNavigate = function (pageKey) {
        switchDashboardPage(pageKey);
        if (window.__closeMobileMenu) window.__closeMobileMenu();
      };

      function setupDesktopSidebarToggle() {
        const btn = document.getElementById('sidebar-toggle-desktop');
        const sidebar = document.getElementById('sidebar');
        if (!btn || !sidebar) return;
        btn.addEventListener('click', () => sidebar.classList.toggle('sidebar-collapsed'));
      }

      window.toggleSideSection = function (key) {
        const body = document.getElementById('side-' + key + '-children');
        const chevron = document.getElementById('side-' + key + '-chevron');
        if (!body || !chevron) return;
        body.classList.toggle('hidden');
        chevron.classList.toggle('rotate-90');
      };

      function ensureSideSectionOpen(key) {
        const body = document.getElementById('side-' + key + '-children');
        const chevron = document.getElementById('side-' + key + '-chevron');
        if (!body || !chevron) return;
        body.classList.remove('hidden');
        chevron.classList.add('rotate-90');
      }

      // --------------------------
      // Partial loader
      // --------------------------
      function loadPartialAlways(container, pageKey) {
        if (!container) return;
        const url = container.getAttribute('data-include');
        if (!url) return;

        fetch(withBust(url), { cache: 'no-store' })
          .then((r) => {
            if (!r.ok) throw new Error('Failed to load: ' + url + ' (' + r.status + ')');
            return r.text();
          })
          .then((html) => {
            container.innerHTML = html;
            afterPartialLoad(pageKey, container);
          })
          .catch((err) => {
            console.error(err);
            container.innerHTML = `
              <div class="max-w-[1200px] mx-auto px-6 py-8 lg:py-10">
                <p class="text-[11px] font-semibold tracking-[0.24em] text-[#9CA3AF] uppercase">Load error</p>
                <h1 class="text-[22px] md:text-[26px] font-semibold tracking-tight text-[#002147]">Failed to load partial</h1>
                <p class="mt-2 text-sm text-[#4B5563]">Could not load <span class="font-mono">${url}</span>. Check file path / deployment.</p>
              </div>
            `;
          });
      }

      // --------------------------
      // US Stocks modal
      // --------------------------
      const UsStocksModal = (function () {
        let prevBodyOverflow = "";

        function open() {
          const modal = $("usStocksHoldingModal");
          if (!modal) return;
          modal.classList.remove("hidden");
          modal.setAttribute("aria-hidden", "false");
          prevBodyOverflow = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          $("usStocksHoldingTicker")?.focus();
        }

        function close() {
          const modal = $("usStocksHoldingModal");
          if (!modal) return;
          modal.classList.add("hidden");
          modal.setAttribute("aria-hidden", "true");
          document.body.style.overflow = prevBodyOverflow || "";
          $("usStocksHoldingForm")?.reset();
        }

        function toast(msg) {
          const t = $("usStocksHoldingToast");
          if (!t) return;
          const inner = t.querySelector("div");
          if (inner && msg) inner.textContent = msg;
          t.classList.remove("hidden");
          setTimeout(() => t.classList.add("hidden"), 1400);
        }

        function bindOnce() {
          $("usStocksHoldingBackdrop")?.addEventListener("click", close);
          $("usStocksHoldingClose")?.addEventListener("click", close);
          $("usStocksHoldingCancel")?.addEventListener("click", close);

          document.addEventListener("keydown", (e) => {
            const modal = $("usStocksHoldingModal");
            if (!modal || modal.classList.contains("hidden")) return;
            if (e.key === "Escape") close();
          });

          $("usStocksHoldingForm")?.addEventListener("submit", async (e) => {
            e.preventDefault();

            const ticker = safeUpper($("usStocksHoldingTicker")?.value);
            const quantity = Number($("usStocksHoldingQty")?.value);
            const costBasis = Number($("usStocksHoldingCost")?.value);

            if (!ticker) return;
            if (!Number.isFinite(quantity) || quantity <= 0) return;
            if (!Number.isFinite(costBasis) || costBasis < 0) return;

            const holding = {
              id: genId(),
              ticker,
              name: "",
              quantity,
              costBasis,
              createdAt: new Date().toISOString()
            };

            const list = loadHoldings();
            list.push(holding);
            saveHoldings(list);

            close();
            toast("Saved. Updating…");

            // Re-render + refresh quotes
            await refreshUsStocksQuotesAndRender();
          });
        }

        return { open, close, toast, bindOnce };
      })();

      // --------------------------
      // US Stocks render/update/delete
      // --------------------------
      async function fetchQuotes(symbols) {
        const endpoint = `${QUOTES_API_BASE}/api/quotes?symbols=${encodeURIComponent(symbols.join(","))}&t=${Date.now()}`;
        const res = await fetch(endpoint, { cache: "no-store" });
        return await res.json();
      }

      function ensureTbody() {
        const page = document.getElementById("page-us-stocks");
        if (!page) return null;

        let tbody = page.querySelector("#usHoldingsTbody");
        if (tbody) return tbody;

        tbody = page.querySelector("table tbody");
        if (tbody) tbody.id = "usHoldingsTbody";
        return tbody || null;
      }

      function renderEmptyState(tbody) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="px-6 py-8 text-sm text-gray-400">
              No holdings yet. Click <span class="font-semibold text-[#0B2A4A]">Add Holding</span> to get started.
            </td>
          </tr>
        `;
      }

      function updateHero(enriched) {
        const page = document.getElementById("page-us-stocks");
        if (!page) return;

        const totalMV = enriched.reduce((s, h) => s + (Number.isFinite(h.mv) ? h.mv : 0), 0);
        const totalCost = enriched.reduce((s, h) => s + (Number.isFinite(h.costTotal) ? h.costTotal : 0), 0);
        const totalGain = totalMV - totalCost;
        const pct = totalCost > 0 ? (totalGain / totalCost) : null;

        const totalEl = page.querySelector("#usStocksTotalEquity");
        if (totalEl) totalEl.textContent = fmtUsd(totalMV);

        const gainValEl = page.querySelector("#usStocksUnrealizedGainVal");
        const gainPctEl = page.querySelector("#usStocksUnrealizedGainPct");

        if (gainValEl) {
          const sign = totalGain >= 0 ? "+" : "−";
          gainValEl.textContent = `${sign}${fmtUsd(Math.abs(totalGain))}`;
        }
        if (gainPctEl) {
          gainPctEl.textContent = pct == null ? "(—)" : `(${fmtPct(pct)})`;
        }

        const asOf = enriched.find(x => x.asOf)?.asOf;
        const asOfEl = page.querySelector("#usStocksAsOf");
        if (asOfEl) {
          asOfEl.textContent = asOf ? new Date(asOf).toLocaleString() : "—";
        }
      }

      function renderTable(enriched) {
        const page = document.getElementById("page-us-stocks");
        if (!page || page.classList.contains("hidden")) return;

        const tbody = ensureTbody();
        if (!tbody) return;

        if (!enriched.length) {
          renderEmptyState(tbody);
          updateHero([]);
          return;
        }

        tbody.innerHTML = enriched.map(h => {
          const gain = h.gain;
          const gainOk = Number.isFinite(gain);
          const good = gainOk ? gain >= 0 : null;

          const gainColor = !gainOk ? "text-gray-400" : (good ? "text-[#005F48]" : "text-[#B91C1C]");
          const mvText = Number.isFinite(h.mv) ? fmtUsd(h.mv) : "—";
          const priceText = Number.isFinite(h.last) ? fmtUsd(h.last) : "—";

          const gainText = !gainOk ? "—" : `${good ? "+" : "−"}${fmtUsd(Math.abs(gain))}`;
          const pctText = (h.ret == null) ? "" : fmtPct(h.ret);

          return `
            <tr class="hover:bg-[#F9FAFB] transition-colors" data-holding-id="${h.id}">
              <td class="py-4 px-6">
                <div class="flex items-start justify-between gap-3">
                  <div class="flex flex-col">
                    <span class="text-[13px] font-semibold text-[#002147]">${h.sym}</span>
                    <span class="text-[11px] text-[#6B7280]">${h.name || "—"}</span>
                  </div>
                  <button
                    type="button"
                    class="btnDeleteHolding text-gray-300 hover:text-rose-600 transition-colors"
                    title="Delete holding"
                    data-holding-id="${h.id}"
                  >
                    <i class="fa-solid fa-trash-can text-[12px]"></i>
                  </button>
                </div>
              </td>

              <td class="py-4 px-4 align-top">
                <span class="font-mono tabular-nums text-[#002147]">${fmtNum(h.quantity)}</span>
              </td>

              <td class="py-4 px-4 align-top">
                <span class="font-mono tabular-nums ${Number.isFinite(h.last) ? "text-[#002147]" : "text-gray-400"}">${priceText}</span>
              </td>

              <td class="py-4 px-4 align-top">
                <span class="font-mono tabular-nums text-[#6B7280]">${fmtUsd(h.costBasis)}</span>
              </td>

              <td class="py-4 px-4 align-top">
                <span class="font-mono tabular-nums ${gainColor}">${gainText}</span>
                ${pctText ? `<div class="mt-1 text-[11px] ${gainColor}">${pctText}</div>` : ""}
              </td>

              <td class="py-4 px-6 align-top text-right">
                <span class="font-mono tabular-nums text-[13px] font-semibold ${Number.isFinite(h.mv) ? "text-[#002147]" : "text-gray-400"}">${mvText}</span>
              </td>
            </tr>
          `;
        }).join("");

        updateHero(enriched);
      }

      async function refreshUsStocksQuotesAndRender() {
        const page = document.getElementById("page-us-stocks");
        if (!page || page.classList.contains("hidden")) return;

        const holdings = loadHoldings();

        if (!holdings.length) {
          const tbody = ensureTbody();
          if (tbody) renderEmptyState(tbody);
          updateHero([]);
          return;
        }

        const symbols = [...new Set(holdings.map(h => safeUpper(h.ticker)).filter(Boolean))];
        let quotes = {};
        try {
          quotes = await fetchQuotes(symbols);
        } catch (e) {
          console.warn("[Quotes] failed", e);
          // render without prices
          quotes = {};
        }

        const enriched = holdings.map(h => {
          const sym = safeUpper(h.ticker);
          const q = quotes[sym] || {};
          const last = (q.price == null ? null : Number(q.price));
          const qty = Number(h.quantity || 0);
          const costBasis = Number(h.costBasis || 0);

          const mv = (last == null ? null : last * qty);
          const costTotal = qty * costBasis;
          const gain = (mv == null ? null : mv - costTotal);
          const ret = (gain == null || costTotal <= 0) ? null : (gain / costTotal);

          return {
            ...h,
            sym,
            last,
            mv,
            costTotal,
            gain,
            ret,
            asOf: q.asOf || ""
          };
        });

        // newest first
        enriched.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));

        renderTable(enriched);
      }

      function setupUsStocksDelegation() {
        // Open modal
        document.addEventListener("click", (e) => {
          const btn = e.target.closest("#btnAddHolding");
          if (btn && btn.closest("#page-us-stocks")) {
            UsStocksModal.open();
            return;
          }

          // Delete holding
          const del = e.target.closest(".btnDeleteHolding");
          if (del && del.closest("#page-us-stocks")) {
            const id = del.getAttribute("data-holding-id");
            if (!id) return;

            const list = loadHoldings();
            const next = list.filter(h => h.id !== id);
            saveHoldings(next);

            refreshUsStocksQuotesAndRender();
          }
        });
      }

      function afterPartialLoad(pageKey) {
        if (pageKey === "us-stocks") {
          // table + totals
          refreshUsStocksQuotesAndRender();
        }
      }

      // --------------------------
      // Page switching
      // --------------------------
      window.switchDashboardPage = function (pageKey) {
        let target = document.getElementById('page-' + pageKey);
        if (!target) {
          pageKey = 'overview';
          target = document.getElementById('page-overview');
        }

        if (pageKey.startsWith('us-')) ensureSideSectionOpen('us');
        if (pageKey.startsWith('tw-')) ensureSideSectionOpen('tw');

        document.querySelectorAll('.dash-page').forEach((p) => p.classList.add('hidden'));

        loadPartialAlways(target, pageKey);
        target.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'auto' });

        document.querySelectorAll('[data-page]').forEach((btn) => btn.classList.remove('side-item-active'));
        document.querySelectorAll('[data-page="' + pageKey + '"]').forEach((btn) => btn.classList.add('side-item-active'));
      };

      function setupUserMenu() {
        const btn = document.getElementById('dash-user-toggle');
        const menu = document.getElementById('dash-user-menu');
        if (!btn || !menu) return;

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          menu.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
          if (menu.classList.contains('hidden')) return;
          if (!btn.contains(e.target) && !menu.contains(e.target)) menu.classList.add('hidden');
        });
      }

      function initDashboard() {
        setupMobileMenu();
        setupDesktopSidebarToggle();
        setupUserMenu();

        // ✅ US Stocks: modal + delete + render + quotes
        UsStocksModal.bindOnce();
        setupUsStocksDelegation();

        switchDashboardPage('overview');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initDashboard);
      } else {
        initDashboard();
      }
    })();
  </script>
</body>
</html>
