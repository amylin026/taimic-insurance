<!DOCTYPE html>
<html lang="en">
<head>
  <title>Taimic – Reports Dashboard</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="main.css" />

  <style>
    .liquid {
      /* ✅ Fix: keep blur (stable). url(#filter) inside backdrop-filter is not reliably supported */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.10);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0 rgba(255, 255, 255, 0.18),
        6px 6px 16px rgba(15, 23, 42, 0.18),
        0 12px 30px rgba(37, 99, 235, 0.20);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    /* Sidebar：上半部是文字型連結 */
    .side-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.25rem 0.1rem;
      font-size: 0.82rem;
      color: #64748b;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      cursor: pointer;
      transition: color 0.15s ease, transform 0.12s ease;
    }

    .side-item:hover {
      color: #0f172a;
      transform: translateX(2px);
    }

    .side-item-active {
      font-weight: 600;
      color: #0f172a;
      position: relative;
    }

    /* 瑞士風：左側 3px 品牌色直線當 active 標記 */
    .side-item-active::before {
      content: '';
      position: absolute;
      left: -0.75rem;
      top: 0.2rem;
      bottom: 0.2rem;
      width: 3px;
      border-radius: 9999px;
      background-color: #002fa7; /* International Klein Blue */
    }

    /* 子選單（縮一格、字再小一點） */
    .side-subitem {
      padding-left: 1.25rem;
      font-size: 0.78rem;
    }

    .side-bottom-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.1rem;
      font-size: 0.82rem;
      color: #64748b;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color 0.15s ease, transform 0.12s ease;
    }

    .side-bottom-link i {
      font-size: 0.8rem;
    }

    .side-bottom-link:hover {
      color: #0f172a;
      transform: translateX(2px);
    }

    /* 三條線的樣式（疊起來） */
    .menu-toggle .bar {
      display: block;
      width: 18px;
      height: 2px;
      border-radius: 9999px;
      background-color: #64748b;
    }

    /* 第二條、第三條往下排一點 */
    .menu-toggle .bar + .bar {
      margin-top: 3px;
    }

    .menu-toggle:hover .bar {
      background-color: #0f172a;
    }

    /* md 以上才會真正把 sidebar 收掉（桌機三條線用） */
    @media (min-width: 768px) {
      #sidebar.sidebar-collapsed {
        display: none !important;
      }
    }

    #ai-notes-list {
      max-height: 260px;
      overflow-y: auto;
    }

    /* ============= Family members page 專用樣式 ============= */
    .family-page {
      background-color: #F9FAFB;
    }

    .family-heading {
      font-family: 'Merriweather', ui-serif, Georgia, 'Times New Roman', serif;
      letter-spacing: 0.02em;
    }

    .family-card {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .family-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
    }

    .family-avatar {
      border-radius: 9999px;
      background: #002147;
      color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .family-role-tag {
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6b7280;
    }

    .family-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.7rem;
      border-radius: 9999px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-width: 1px;
      border-style: solid;
    }

    .family-status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
    }

    .family-status-full {
      background-color: #ecfdf3;
      border-color: rgba(34, 197, 94, 0.3);
      color: #15803d;
    }

    .family-status-full .family-status-dot {
      background-color: #22c55e;
    }

    .family-status-shared {
      background-color: #eff6ff;
      border-color: rgba(37, 99, 235, 0.3);
      color: #1d4ed8;
    }

    .family-status-shared .family-status-dot {
      background-color: #2563eb;
    }

    .family-status-limited {
      background-color: #f9fafb;
      border-color: #e5e7eb;
      color: #4b5563;
    }

    .family-status-limited .family-status-dot {
      background-color: #9ca3af;
    }

    .family-meta-label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .family-meta-value {
      font-size: 0.75rem;
      color: #4b5563;
    }

    .family-divider {
      height: 1px;
      background: linear-gradient(to right, rgba(148, 163, 184, 0.28), rgba(148, 163, 184, 0.06));
    }

    /* ==========================================================
       ✅ Insurance 字體統一（照 us-accounts 的標題/大數字 serif）
       不改你的 partial 檔，載入後自動套用
       ========================================================== */
    #page-us-insurance h1,
    #page-tw-insurance h1 {
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif !important;
    }

    /* Insurance 頁面所有 mono/tabular 的數字 → 改成 serif（避免你不要的那種數字字體） */
    #page-us-insurance .font-mono,
    #page-tw-insurance .font-mono,
    #page-us-insurance .tabular-nums,
    #page-tw-insurance .tabular-nums {
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif !important;
    }

    /* ==========================================================
       ✅ Overview: Privacy Mode（只模糊數字，不改其他）
       ========================================================== */
    .privacy-sensitive {
      transition: filter 180ms ease;
    }
    .privacy-on .privacy-sensitive {
      filter: blur(7px);
      -webkit-filter: blur(7px);
      user-select: none;
    }
  </style>

  <script>
    (function () {
      // 手機右側抽屜
      function setupMobileMenu() {
        const toggle = document.getElementById('sidebar-toggle-mobile');
        const overlay = document.getElementById('mobile-menu');
        const panel = document.getElementById('mobile-menu-panel');

        if (!toggle || !overlay || !panel) {
          console.warn('Mobile menu elements missing', { toggle, overlay, panel });
          return;
        }

        let prevBodyOverflow = '';

        function lockScroll() {
          prevBodyOverflow = document.body.style.overflow;
          document.body.style.overflow = 'hidden';
        }

        function unlockScroll() {
          document.body.style.overflow = prevBodyOverflow || '';
        }

        function openMenu() {
          overlay.classList.remove('hidden');
          lockScroll();
          panel.offsetHeight; // reflow
          panel.classList.remove('translate-x-full');
        }

        function closeMenu() {
          panel.classList.add('translate-x-full');

          const transitionHandler = () => {
            if (panel.classList.contains('translate-x-full')) {
              overlay.classList.add('hidden');
              unlockScroll();
            }
          };

          panel.addEventListener('transitionend', transitionHandler, { once: true });
        }

        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          if (overlay.classList.contains('hidden')) openMenu();
          else closeMenu();
        });

        overlay.addEventListener('click', (event) => {
          if (event.target === overlay) closeMenu();
        });

        window.__closeMobileMenu = closeMenu;
      }

      // 手機導航
      window.mobileNavigate = function (pageKey) {
        switchDashboardPage(pageKey);
        if (window.__closeMobileMenu) window.__closeMobileMenu();
        else {
          const overlay = document.getElementById('mobile-menu');
          if (overlay) overlay.classList.add('hidden');
        }
      };

      // 桌機 sidebar 收合
      function setupDesktopSidebarToggle() {
        const btn = document.getElementById('sidebar-toggle-desktop');
        const sidebar = document.getElementById('sidebar');
        if (!btn || !sidebar) return;
        btn.addEventListener('click', () => {
          sidebar.classList.toggle('sidebar-collapsed');
        });
      }

      // 左側 US / TW 小箭頭展開/收合
      window.toggleSideSection = function (key) {
        const body = document.getElementById('side-' + key + '-children');
        const chevron = document.getElementById('side-' + key + '-chevron');
        if (!body || !chevron) return;
        body.classList.toggle('hidden');
        chevron.classList.toggle('rotate-90');
      };

      function ensureSideSectionOpen(key) {
        const body = document.getElementById('side-' + key + '-children');
        const chevron = document.getElementById('side-' + key + '-chevron');
        if (!body || !chevron) return;
        body.classList.remove('hidden');
        chevron.classList.add('rotate-90');
      }

      // ✅ 切頁保險：如果 include-partials.js 沒載 hidden pages，這裡會按需載入
      function loadPartialIfNeeded(container) {
        if (!container) return;
        const url = container.getAttribute('data-include');
        if (!url) return;

        // 如果已經有內容了，就當作 loaded（避免重複 fetch）
        if (container.dataset.loaded === '1') return;
        if ((container.innerHTML || '').trim().length > 0) {
          container.dataset.loaded = '1';
          return;
        }

        fetch(url)
          .then((r) => {
            if (!r.ok) throw new Error('Failed to load: ' + url + ' (' + r.status + ')');
            return r.text();
          })
          .then((html) => {
            container.innerHTML = html;
            container.dataset.loaded = '1';
          })
          .catch((err) => {
            console.error(err);
            container.innerHTML = `
              <div class="max-w-[1200px] mx-auto px-6 py-8 lg:py-10">
                <p class="text-[11px] font-semibold tracking-[0.24em] text-[#9CA3AF] uppercase">
                  Load error
                </p>
                <h1 class="text-[22px] md:text-[26px] font-semibold tracking-tight text-[#002147]">
                  Failed to load partial
                </h1>
                <p class="mt-2 text-sm text-[#4B5563]">
                  Could not load <span class="font-mono">${url}</span>. Check file path / deployment.
                </p>
              </div>
            `;
            container.dataset.loaded = '1';
          });
      }

      // 切換 dashboard 各頁
      window.switchDashboardPage = function (pageKey) {
        let target = document.getElementById('page-' + pageKey);

        if (!target) {
          console.warn('[Dashboard] Page not found:', pageKey, '→ fallback to overview');
          pageKey = 'overview';
          target = document.getElementById('page-overview');
        }

        if (pageKey.startsWith('us-')) ensureSideSectionOpen('us');
        if (pageKey.startsWith('tw-')) ensureSideSectionOpen('tw');

        const pages = document.querySelectorAll('.dash-page');
        pages.forEach((page) => page.classList.add('hidden'));

        // ✅ 先確保 partial 真的被載進來（overview 沒 data-include，會自然略過）
        loadPartialIfNeeded(target);

        target.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'auto' });

        // ✅ Overview 顯示時：讓圖表做一次 resize（避免 hidden 初次渲染尺寸不對）
        if (pageKey === 'overview' && window.__overviewOnShow) {
          try { window.__overviewOnShow(); } catch (e) {}
        }

        // 更新 sidebar active 樣式
        const navButtons = document.querySelectorAll('[data-page]');
        navButtons.forEach((btn) => btn.classList.remove('side-item-active'));
        const activeButtons = document.querySelectorAll('[data-page="' + pageKey + '"]');
        activeButtons.forEach((btn) => btn.classList.add('side-item-active'));
      };

      // Avatar menu
      function setupUserMenu() {
        const btn = document.getElementById('dash-user-toggle');
        const menu = document.getElementById('dash-user-menu');
        if (!btn || !menu) return;

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          menu.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
          if (menu.classList.contains('hidden')) return;
          if (!btn.contains(e.target) && !menu.contains(e.target)) {
            menu.classList.add('hidden');
          }
        });
      }

      function initDashboard() {
        setupMobileMenu();
        setupDesktopSidebarToggle();
        setupUserMenu();
        switchDashboardPage('overview');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initDashboard);
      } else {
        initDashboard();
      }
    })();
  </script>

                </p>
                <p className="mt-1 text-xs text-[#4B5563]">
                  FX impact is tracked separately from market performance (this is your “Taimic Magic”).
                </p>
              </div>
            </div>
          </div>

          {/* AI Insight banner */}
          <div className="bg-blue-50 border border-blue-100 rounded-2xl p-5 md:p-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div className="flex items-start gap-3">
              <div className="w-10 h-10 rounded-xl bg-white border border-blue-100 flex items-center justify-center">
                <i className="fa-solid fa-wand-magic-sparkles text-blue-700 text-sm"></i>
              </div>
              <div>
                <p className="text-[10px] font-semibold tracking-[0.24em] uppercase text-blue-700/70">
                  AI Insight
                </p>
                <p className="mt-1 text-sm text-[#1F2937]">
                  Insight: Your Taiwan insurance policy <span className="font-semibold">“Fubon Life”</span> is approaching its maturity date next month.
                  We recommend reviewing tax implications.
                </p>
              </div>
            </div>

            <button
              type="button"
              className="inline-flex items-center justify-center gap-2 rounded-full bg-[#002147] text-white text-xs font-semibold px-4 py-2.5 shadow-sm hover:bg-[#001a70] transition self-start md:self-auto"
            >
              <span>View Suggestion</span>
              <i className="fa-solid fa-arrow-right-long text-[11px]"></i>
            </button>
          </div>
        </div>
      );
    }

    function MoverRow({ name, pct, delta, tone, badge }) {
      const up = tone === 'up';
      return (
        <div className="flex items-center justify-between gap-4 rounded-xl border border-slate-200/70 bg-white px-4 py-3">
          <div className="min-w-0">
            <div className="flex items-center gap-2">
              <p className="text-sm font-semibold text-slate-900 truncate">{name}</p>
              {badge ? (
                <span className={"text-[10px] font-semibold px-2 py-0.5 rounded-full border " + badge.color}>
                  {badge.text}
                </span>
              ) : null}
            </div>
            <p className="mt-0.5 text-xs text-slate-500">
              Intraday change
            </p>
          </div>

          <div className="text-right shrink-0">
            <div className={"privacy-sensitive text-sm font-semibold " + (up ? "text-emerald-700" : "text-rose-700")}>
              {pct}
            </div>
            <div className={"privacy-sensitive text-xs " + (up ? "text-emerald-700/80" : "text-rose-700/80")}>
              ({delta})
            </div>
          </div>
        </div>
      );
    }

    (function mountOverview() {
      const rootEl = document.getElementById('overview-react-root');
      if (!rootEl || rootEl.dataset.mounted === '1') return;

      // React 18 createRoot if available; fallback to render
      if (ReactDOM.createRoot) {
        ReactDOM.createRoot(rootEl).render(<OverviewPage />);
      } else {
        ReactDOM.render(<OverviewPage />, rootEl);
      }

      rootEl.dataset.mounted = '1';
    })();
  </script>
</body>
</html>
