<!-- pages/tax-packet.html -->
<div class="max-w-[1200px] mx-auto px-6 py-8 lg:py-10 space-y-6">
  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
    <div>
      <p class="text-[11px] font-semibold tracking-[0.24em] text-[#9CA3AF] uppercase">Annual compliance</p>
      <h1 class="text-[28px] md:text-[32px] font-semibold tracking-tight text-[#002147] font-serif">
        Household Tax Packet
      </h1>
      <p class="mt-2 text-sm text-[#4B5563]">
        One consolidated handoff bundle (TW + US) you can send to your CPA/EA.
      </p>
    </div>

    <button type="button" onclick="window.print()"
      class="rounded-xl border border-gray-200 bg-white px-4 py-2 text-sm font-semibold text-[#0B2A4A] hover:bg-gray-50">
      Print / Save as PDF
    </button>
  </div>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
    <p class="text-[11px] font-semibold tracking-[0.24em] text-[#9CA3AF] uppercase">Section A</p>
    <h2 class="mt-1 text-xl font-semibold text-[#002147]">US Insurance</h2>
    <div id="taxPacketUSInsurance" class="mt-4 space-y-4"></div>
  </div>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
    <p class="text-[11px] font-semibold tracking-[0.24em] text-[#9CA3AF] uppercase">Section B</p>
    <h2 class="mt-1 text-xl font-semibold text-[#002147]">Taiwan Insurance</h2>
    <div id="taxPacketTWInsurance" class="mt-4 space-y-4"></div>
  </div>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
    <p class="text-[11px] font-semibold tracking-[0.24em] text-[#9CA3AF] uppercase">Checklist</p>
    <h2 class="mt-1 text-xl font-semibold text-[#002147]">Missing info</h2>
    <ul id="taxPacketMissingList" class="mt-3 list-disc pl-5 text-sm text-[#4B5563] space-y-1"></ul>
    <p class="mt-3 text-[11px] text-gray-400">
      Disclaimer: This is an organizational summary, not tax/legal advice.
    </p>
  </div>
</div>
